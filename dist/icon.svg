<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="拾光笔记">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#285b50"/>
      <stop offset="0.55" stop-color="#4f806b"/>
      <stop offset="1" stop-color="#83a782"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f1e9d8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f7dda6"/>
      <stop offset="1" stop-color="#dba75f"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="14" result="offsetBlur"/>
      <feFlood flood-color="#183f35" flood-opacity="0.28" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

