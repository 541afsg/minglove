name: Build Android APK and publish 拾光笔记

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare Android app icons
        run: node scripts/generate-android-icons.mjs
      - name: Create Android project
        run: npx cap add android
      - name: Generate Android app icons
        run: npx capacitor-assets generate --android
      - name: Sync web app into Android project
        run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Add APK to site downloads
        run: mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk dist/shiguangbiji.apk
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload app files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
